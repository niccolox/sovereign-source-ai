<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" aria-label="Sovereign Source AI logo">
  <!--
    Sovereign Source AI — Logo Mark (refined)
    Patriotic USA inspiration: three horizontal bars (flag stripe echo)
    in red, navy, red; topped by a single five-point star.
    Refined: larger bars, bigger star, tighter rhythm, no inner detail.
    Colors: #BF0D3E (patriotic red), #0A3168 (deep navy blue)
  -->

  <!-- Three horizontal bars — flag stripe echo (refined proportions) -->
  <rect x="10" y="56" width="80" height="9" rx="1.5" fill="#BF0D3E"/>
  <rect x="10" y="66" width="80" height="9" rx="1.5" fill="#0A3168"/>
  <rect x="10" y="76" width="80" height="9" rx="1.5" fill="#BF0D3E"/>

  <!-- Five-point star — sovereign, central, above bars -->
  <!-- Outer star: patriotic red fill, deep navy outline for authority -->
  <polygon
    points="55,4 71.1,35.2 96.6,37.5 78.7,58.3 81.4,84.5 50,73.6 18.6,84.5 21.3,58.3 3.4,37.5 28.9,35.2"
    fill="#BF0D3E"
    stroke="#0A3168"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
</svg>

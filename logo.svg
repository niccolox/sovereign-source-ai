<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" aria-label="Sovereign Source AI logo">
  <!--
    Sovereign Source AI — Logo Mark
    Patriotic USA inspiration: three horizontal bars (flag stripe echo)
    in red, navy, red; topped by a single five-point star.
    Designed for dark-site use (sovsrc.ai).
    Colors: #BF0D3E (patriotic red), #0A3168 (deep navy blue)
  -->

  <!-- Three horizontal bars — flag stripe echo -->
  <rect x="12" y="54" width="76" height="8" rx="1.5" fill="#BF0D3E"/>
  <rect x="12" y="66" width="76" height="8" rx="1.5" fill="#0A3168"/>
  <rect x="12" y="78" width="76" height="8" rx="1.5" fill="#BF0D3E"/>

  <!-- Five-point star above the bars — sovereign, central -->
  <polygon
    points="50,14 58,34 78,34 62,46 67,66 50,54 33,66 38,46 22,34 42,34"
    fill="#BF0D3E"
    stroke="#0A3168"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Inner star counterpoint — navy, smaller, centered in the red star -->
  <polygon
    points="50,27 53.5,37 63,37 56,42.5 58.5,52 50,47.5 41.5,52 44,42.5 37,37 46.5,37"
    fill="#0A3168"
  />
</svg>
